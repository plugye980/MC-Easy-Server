<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 사이드바 로고(34px 판, 22px 안쪽 네모)를 그대로 키운 앱 아이콘 -->
  <defs>
    <linearGradient id="face" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#3fa3d6"/>
      <stop offset="1" stop-color="#2b86b8"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="well" x="-20%" y="-20%" width="140%" height="140%">
      <!-- 안쪽 네모의 파인 그늘(위에서 오는 빛) -->
      <feOffset dy="40"/><feGaussianBlur stdDeviation="40" result="b"/>
      <feComposite in="SourceAlpha" in2="b" operator="arithmetic" k2="-1" k3="1" result="shadow"/>
      <feFlood flood-color="#1c5f86" flood-opacity="0.35"/>
      <feComposite in2="shadow" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="282" fill="url(#face)"/>
  <rect x="32" y="32" width="960" height="960" rx="282" fill="url(#lit)"/>
  <rect x="201.5" y="201.5" width="621" height="621" rx="141" fill="#fbfeff" filter="url(#well)"/>
</svg>
