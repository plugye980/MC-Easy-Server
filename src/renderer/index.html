<!doctype html>
<html lang="ko" data-theme="light" data-ui="off">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCES</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 배경: 흰 삼각 그리드 공간 (scene.js). 마우스에 따라 아주 조금 기운다 -->
  <div class="stage" aria-hidden="true"><div class="world"></div></div>
  <!-- 배경에만 거는 렌즈: 가장자리 색수차 → 블러, 그 위로 빛 번짐 (UI 글자에는 걸지 않는다) -->
  <div class="bg-lens" aria-hidden="true">
    <div class="lens-ca"></div>
    <div class="lens-blur"></div>
    <div class="bloom"></div>
  </div>
  <!-- 위쪽 머리글: 로고 · 앱 버전 · PC 사양 -->
  <header class="topbar" aria-hidden="true"></header>

  <!-- 공간 속에 비스듬히 선 판: 왼쪽은 서버 목록과 고른 서버, 오른쪽은 탭과 내용 -->
  <div class="ui">
    <section class="pane pane-l" aria-label="서버">
      <span class="pin pin-tl"></span><span class="pin pin-br"></span>
      <div class="col-a">
        <div class="pane-scroll">
          <nav class="nav" id="side" aria-label="내 서버"></nav>
          <div class="detail" id="detail"></div>
        </div>
        <div class="pane-foot" id="paneFoot"></div>
      </div>
      <!-- 서버 페이지: 탭과 내용이 여기로 옮겨 와 한 창이 된다 -->
      <div class="col-b" id="colB"></div>
    </section>

    <section class="pane pane-r" aria-label="내용">
      <span class="pin pin-tl"></span><span class="pin pin-br"></span>
      <main class="main" id="main"></main>
    </section>
  </div>

  <!-- 화면 전체 렌즈: 옅은 비네트와 낟알 -->
  <div class="lens" aria-hidden="true">
    <div class="lens-vignette"></div>
    <div class="grain"></div>
  </div>
  <!-- 종료할 때 천천히 덮이는 어둠 -->
  <div class="shade" aria-hidden="true"></div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="overlay" id="overlay" hidden></div>

  <script src="scene.js"></script>
  <script src="ui.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
