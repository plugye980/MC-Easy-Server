<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCES</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="f-shade" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="4.5" /></filter>
      <filter id="f-shade-sm" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="4" /></filter>
      <filter id="f-soft" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="1" /></filter>
    </defs>
  </svg>

  <div class="app">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="overlay" id="overlay" hidden></div>

  <script src="ui.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
